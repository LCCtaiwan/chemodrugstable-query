name: Update NHI lookup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-nhi-lookup.yml"
      - "tools/nhi/**"
      - "tests/test_nhi*.py"
      - "index.html"
      - ".nojekyll"
      - "inserts/**"
      - "data/inserts/documents.json"
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    outputs:
      ready: ${{ steps.source.outputs.ready }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils poppler-data
      - name: Run cleaner tests
        run: python3 -m unittest discover -s tests -p 'test_nhi*.py'
      - name: Read verified official source
        run: |
          echo "RULES_PDF_URL=$(jq -r .rulesPdf tools/nhi/rules_source.json)" >> "$GITHUB_ENV"
          echo "RULES_DOCX_URL=$(jq -r .rulesDocx tools/nhi/rules_source.json)" >> "$GITHUB_ENV"
          echo "PREVIOUS_VERSION_URL=$(jq -r .previousVersionUrl tools/nhi/rules_source.json)" >> "$GITHUB_ENV"
      - name: Download, clean and build
        id: source
        run: |
          mkdir -p _site/nhi _status
          cp index.html .nojekyll _site/
          python3 tools/nhi/update_from_official.py \
            --output _site/nhi/index.html \
            --as-of "$(TZ=Asia/Taipei date +%F)" \
            --rules-pdf-url "$RULES_PDF_URL" \
            --rules-docx-url "$RULES_DOCX_URL" \
            --previous-version-url "$PREVIOUS_VERSION_URL" \
            --status-file _status/source_status.json
          STATUS=$(jq -r .status _status/source_status.json)
          MESSAGE=$(jq -r .message _status/source_status.json)
          if [ "$STATUS" = "ready" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$MESSAGE"
          fi
          {
            echo "## 健保給付條文來源檢查"
            echo
            echo "- 狀態：$STATUS"
            echo "- 說明：$MESSAGE"
            if [ "$STATUS" != "ready" ]; then
              echo "- 發布：已跳過，GitHub Pages 保留既有版本"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify build metadata
        if: steps.source.outputs.ready == 'true'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("_site/nhi/data_version.json").read_text())
          meta = data["meta"]
          assert meta["recordCount"] > 0, meta
          assert meta["chapterCount"] > 0, meta
          assert meta["missingChapterCount"] == 0, meta
          assert meta["tfdaRecordCount"] > 10000, meta
          assert meta["rulesVersion"] == meta["rulesOfficialVersion"], meta
          assert meta["rulesPdfPages"] >= 300, meta
          assert meta["rulesPdfBytes"] >= 2000000, meta
          assert len(meta["rulesPdfSha256"]) == 64, meta
          assert meta["rulesSource"] == "docx", meta
          assert meta["rulesDocxBytes"] >= 2000000, meta
          assert len(meta["rulesDocxSha256"]) == 64, meta
          assert meta["sourceVerification"] == "word-primary-pdf-secondary", meta
          page = Path("_site/nhi/index.html").read_text()
          assert "Pemetrexed" in page
          assert "https://www.nhi.gov.tw/" in page
          assert "https://mcp.fda.gov.tw/im_detail_1/" in page
          assert "TFDA 藥證／仿單入口" in page
          links = meta["linkageStats"]
          assert links["total"] == meta["recordCount"], links
          assert sum(links.get(k, 0) for k in ("matched", "inactive", "unresolved", "missing_official_id", "ambiguous")) == links["total"], links
          assert links.get("confirmed", 0) == links.get("matched", 0) + links.get("inactive", 0), links
          print(json.dumps(meta, ensure_ascii=False, indent=2))
          PY
      - name: Include electronic insert search
        if: steps.source.outputs.ready == 'true'
        run: |
          mkdir -p _site/inserts
          cp inserts/index.html _site/inserts/index.html
          if [ -f data/inserts/documents.json ]; then
            cp data/inserts/documents.json _site/inserts/documents.json
          fi
      - uses: actions/configure-pages@v6
        if: steps.source.outputs.ready == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.source.outputs.ready == 'true'
        with:
          path: _site

  deploy:
    if: needs.build.outputs.ready == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
